name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
     
    - name: Build
      run: dotnet build --no-restore --configuration Release
    
    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: build
        path: ExperimentWithActions/bin/Release/net10.0/*

  create-image:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7

    - name: Download build artifact
      uses: actions/download-artifact@v7
      with:
        name: build
        path: build

    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ExperimentWithActions/Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/experiment-with-actions:latest